# FRIDAY kernel configuration.
# Copied into the user data directory on first launch; edits there win.

bridge:
  host: 127.0.0.1
  port: 8765
  # The token is minted per launch by the Electron main process.

workspace:
  root: "C:/FRIDAY/workspace"
  allow_outside_root: false

memory:
  backend: chroma        # chroma | faiss
  embed_model: bge-m3
  chunk_chars: 2000
  recall_k: 6

automation:
  auto_approve_safe: true
  auto_approve_workspace_writes: false
  auto_approve_exec: false        # never default this to true; the planner never auto-runs exec
  write_lessons_on_failure: true  # honoured by kernel/planner.py; Brain autoLearn can override live
  daily_update_check: true

roles:
  brain: brain-qwen
  coder: coder-ds
  researcher: research-online
  fast: fast-llama
  embed: embed-bge
