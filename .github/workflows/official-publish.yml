# FRIDAY - Official Publish (one-click end-to-end official release)
#
# This workflow adds NO release behaviour of its own. It owns no versioning, no
# changelog, no build, no tag, no merge and no cleanup. It only sequences the
# existing workflows, in this same run:
#
#   plan on main
#   Release / Build prepare stage, when the plan says prepare
#   pin the release pull request
#   reuse or wait for PR Validation, or call that workflow in this run
#   Safe Merge for that pull request
#   verify origin/main
#   Release / Build publish stage (also a direct publish or a rebuild)
#   confirm the assets
#
# A nested dispatch is not used. That new run's actor is github-actions[bot],
# and workflow execution protections refuse that actor before any job exists.
# workflow_call keeps the person who clicked Run.
#
# The default token below is read-only. A job that calls another workflow
# raises the token only to what that workflow already declares. Orchestrator
# jobs stay read-only: they do not push, merge, tag, or release.
#
# Anything unknown, ambiguous, failing or still running stops the run. Nothing
# is merged, built, tagged or published on stale or unverified information.

name: Official Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = finish the current number, do not invent the next; update = next number from release_type; rebuild = pack this number again"
        type: choice
        default: auto
        options: [auto, update, rebuild]
      release_type:
        description: "Only the chosen counter moves. auto on update = patch, minor, or major from the changes, never extreme. patch = fourth +1. minor = third +1. major = second +1. extreme = first +1, manual only. revision = rebuild, same number."
        type: choice
        default: auto
        options: [auto, patch, minor, major, extreme, revision]
      title:
        description: "Release title (optional)"
        type: string
        default: ""
      notes:
        description: "Release notes override (optional - replaces the generated notes)"
        type: string
        default: ""

concurrency:
  group: friday-official-publish
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      step: ${{ steps.plan.outputs.step }}
      version: ${{ steps.plan.outputs.version }}
      pr: ${{ steps.plan.outputs.pr }}
      publish_mode: ${{ steps.plan.outputs.publish_mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      RELEASE_TYPE: ${{ inputs.release_type }}

    steps:
      - name: Refuse anything but a manual run on main
        shell: bash
        run: |
          [ '${{ github.ref_name }}' = 'main' ] || {
            echo "::error::Official Publish runs from main only (this run: ${{ github.ref_name }})."
            exit 1
          }
          [ '${{ github.event_name }}' = 'workflow_dispatch' ] || {
            echo "::error::Official Publish is manual only (workflow_dispatch)."
            exit 1
          }

      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Read the real repository state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          # Always the live main identity, even if this job's checkout lagged.
          current=$(node scripts/release-engine.cjs identity --ref origin/main --field releaseVersion)
          gh pr list --state all --base main --limit 60 \
            --json number,state,headRefName,mergedAt \
            | jq '[ .[]
                    | select(.headRefName | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
                    | { number: .number,
                        version: (.headRefName | sub("^release/v";"")),
                        state: (if .mergedAt != null then "merged" else (.state|ascii_downcase) end) } ]' \
            > prepared.json
          gh release list --limit 60 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease|not) | .tagName | sub("^v";"")' > released.txt
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "main declares v$current"
          cat prepared.json

      - name: Decide the next safe step
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orchestrator-engine.cjs plan \
            --mode "$MODE" \
            --current '${{ steps.state.outputs.current }}' \
            --type "$RELEASE_TYPE" \
            --prepared prepared.json \
            --released released.txt > plan.json
          cat plan.json
          {
            echo "step=$(jq -r '.step' plan.json)"
            echo "version=$(jq -r '.version // ""' plan.json)"
            echo "pr=$(jq -r '.prNumber // ""' plan.json)"
            echo "publish_mode=$(jq -r '.publishMode // "auto"' plan.json)"
          } >> "$GITHUB_OUTPUT"
          echo "### Official Publish plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- step: \`$(jq -r '.step' plan.json)\` - $(jq -r '.reason' plan.json)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.step' plan.json)" = "publish" ]; then
            echo "resuming: main already carries unpublished v$(jq -r '.version' plan.json) - skipping prepare/merge"
          fi
          if [ "$(jq -r '.step' plan.json)" = "rebuild" ]; then
            echo "rebuild: republishing v$(jq -r '.version' plan.json) without a version change"
          fi

      # An unsafe or ambiguous state must stop the run here. Without this a
      # later publish job could still run for step = error.
      - name: Stop on an unsafe or ambiguous release state
        if: steps.plan.outputs.step == 'error'
        shell: bash
        run: |
          echo "::error::$(jq -r '.reason' plan.json)"
          echo ""
          node -e "process.stdout.write(require('./scripts/release-engine.cjs').releaseOperatorGuide({version: process.argv[1]}))" '${{ steps.state.outputs.current }}'
          exit 1

      - name: Stop on an unknown orchestration step
        if: steps.plan.outputs.step != 'prepare' && steps.plan.outputs.step != 'merge' && steps.plan.outputs.step != 'publish' && steps.plan.outputs.step != 'rebuild' && steps.plan.outputs.step != 'error'
        shell: bash
        run: |
          echo "::error::unknown orchestration step: ${{ steps.plan.outputs.step }}"
          exit 1

  prepare-release:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.step == 'prepare'
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      stage: prepare
      mode: ${{ inputs.mode }}
      release_type: ${{ inputs.release_type }}
      title: ${{ inputs.title }}
      notes: ${{ inputs.notes }}
      caller: official-publish
    secrets: inherit

  pin:
    needs: [plan, prepare-release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') &&
      (needs.plan.outputs.step == 'prepare' || needs.plan.outputs.step == 'merge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      pr: ${{ steps.prepared.outputs.pr }}
      version: ${{ steps.prepared.outputs.version }}
      head: ${{ steps.prepared.outputs.head }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Pin the prepared release Pull Request
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --state open --base main --limit 60 \
            --json number,state,headRefName,headRefOid,url \
            | jq '[ .[]
                    | select(.headRefName | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
                    | { number, state, url, headSha: .headRefOid,
                        version: (.headRefName | sub("^release/v";"")) } ]' > open.json
          set +e
          node scripts/orchestrator-engine.cjs pin-pr \
            --expect '${{ needs.plan.outputs.version }}' \
            --open open.json > pinned.json
          code=$?
          set -e
          cat pinned.json
          if [ "$code" != "0" ]; then
            echo "::error::$(jq -r '.reason // "could not pin the release Pull Request"' pinned.json)"
            exit 1
          fi
          {
            echo "pr=$(jq -r '.number' pinned.json)"
            echo "version=$(jq -r '.version' pinned.json)"
            echo "head=$(jq -r '.headSha' pinned.json)"
          } >> "$GITHUB_OUTPUT"

  evidence:
    needs: [plan, pin]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.pin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      action: ${{ steps.decision.outputs.action }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.pin.outputs.pr }}
      PINNED: ${{ needs.pin.outputs.head }}
      VERSION: ${{ needs.pin.outputs.version }}
    steps:
      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Wait for the required checks
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          pr="$PR_NUMBER"
          pinned="$PINNED"
          gh pr view "$pr" --json headRefOid,state > head.json
          head=$(jq -r '.headRefOid' head.json)
          node scripts/orchestrator-engine.cjs verify-head \
            --number "$pr" --pinned "$pinned" --current "$head" \
            --state "$(jq -r '.state|ascii_downcase' head.json)" > head-verdict.json \
            || { echo "::error::$(jq -r '.reason' head-verdict.json)"; exit 1; }
          node scripts/validation-freshness.cjs --sha "$pinned" > decision.json
          action=$(node -e "process.stdout.write(require('./decision.json').action)")
          echo "validation evidence: $(node -e "process.stdout.write(require('./decision.json').reason)")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [ "$action" = "run" ]; then
            echo "PR Validation will run in this Official Publish run for $pinned"
            exit 0
          fi
          if [ "$action" = "reuse" ]; then
            echo "fresh green PR Validation on $pinned; not starting another run"
          elif [ "$action" = "wait" ]; then
            echo "PR Validation is already running; waiting for it"
          else
            echo "::error::unknown validation evidence action: $action"
            exit 1
          fi
          # Windows validate is allowed 90 minutes, and the runner may also queue.
          # 40 waits of 180s cover 120 minutes. This job only waits. The Windows
          # job, Safe Merge, and publish have their own budgets.
          for attempt in $(seq 1 40); do
            gh pr view "$pr" --json headRefOid,state > head.json
            head=$(jq -r '.headRefOid' head.json)
            node scripts/orchestrator-engine.cjs verify-head \
              --number "$pr" --pinned "$pinned" --current "$head" \
              --state "$(jq -r '.state|ascii_downcase' head.json)" > head-verdict.json \
              || { echo "::error::$(jq -r '.reason' head-verdict.json)"; exit 1; }
            gh api "repos/${{ github.repository }}/commits/$pinned/check-runs" --paginate \
              --jq '.check_runs[] | {name, status, conclusion, head_sha, detailsUrl: .details_url}' \
              | jq -s '.' > runs.json 2>/dev/null || echo '[]' > runs.json
            gh api "repos/${{ github.repository }}/commits/$pinned/status" \
              --jq '[.statuses[] | {name: .context, status: "completed", conclusion: .state, detailsUrl: .target_url}]' \
              > statuses.json 2>/dev/null || echo '[]' > statuses.json
            jq -s --arg sha "$pinned" '(.[0] + (.[1] | map(. + {head_sha: $sha})))' \
              runs.json statuses.json > rollup.json
            set +e
            node scripts/orchestrator-engine.cjs checks \
              --head "$pinned" --checks rollup.json --required 'PR Validation' > verdict.json
            code=$?
            set -e
            reason=$(jq -r '.reason' verdict.json)
            [ "$code" = "0" ] && { echo "checks ready: $reason"; exit 0; }
            if [ "$code" = "2" ]; then
              echo "::error::$reason"
              jq -r '.diagnostic // ""' verdict.json
              exit 1
            fi
            echo "waiting for checks (attempt $attempt): $reason"
            sleep 180
          done
          echo "::error::the required checks did not finish in time."
          echo "observed evidence for $pinned:"
          cat rollup.json
          exit 1

  validate:
    needs: [plan, pin, evidence]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.pin.result == 'success' &&
      needs.evidence.result == 'success' &&
      needs.evidence.outputs.action == 'run'
    permissions:
      contents: write
      statuses: write
      pull-requests: read
      security-events: write
      actions: read
    uses: ./.github/workflows/pr-validation.yml
    with:
      sha: ${{ needs.pin.outputs.head }}
      head_ref: release/v${{ needs.pin.outputs.version }}
      caller: official-publish

  confirm-checks:
    needs: [plan, pin, evidence, validate]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.pin.result == 'success' &&
      needs.evidence.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.pin.outputs.pr }}
      PINNED: ${{ needs.pin.outputs.head }}
    steps:
      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Confirm PR Validation on the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          pr="$PR_NUMBER"
          pinned="$PINNED"
          for attempt in $(seq 1 8); do
            gh pr view "$pr" --json headRefOid,state > head.json
            head=$(jq -r '.headRefOid' head.json)
            node scripts/orchestrator-engine.cjs verify-head \
              --number "$pr" --pinned "$pinned" --current "$head" \
              --state "$(jq -r '.state|ascii_downcase' head.json)" > head-verdict.json \
              || { echo "::error::$(jq -r '.reason' head-verdict.json)"; exit 1; }
            gh api "repos/${{ github.repository }}/commits/$pinned/check-runs" --paginate \
              --jq '.check_runs[] | {name, status, conclusion, head_sha, detailsUrl: .details_url}' \
              | jq -s '.' > runs.json 2>/dev/null || echo '[]' > runs.json
            gh api "repos/${{ github.repository }}/commits/$pinned/status" \
              --jq '[.statuses[] | {name: .context, status: "completed", conclusion: .state, detailsUrl: .target_url}]' \
              > statuses.json 2>/dev/null || echo '[]' > statuses.json
            jq -s --arg sha "$pinned" '(.[0] + (.[1] | map(. + {head_sha: $sha})))' \
              runs.json statuses.json > rollup.json
            set +e
            node scripts/orchestrator-engine.cjs checks \
              --head "$pinned" --checks rollup.json --required 'PR Validation' > verdict.json
            code=$?
            set -e
            reason=$(jq -r '.reason' verdict.json)
            [ "$code" = "0" ] && { echo "checks ready: $reason"; exit 0; }
            if [ "$code" = "2" ]; then
              echo "::error::$reason"
              jq -r '.diagnostic // ""' verdict.json
              exit 1
            fi
            echo "waiting for the status to land (attempt $attempt): $reason"
            sleep 15
          done
          echo "::error::PR Validation did not report on $pinned."
          cat rollup.json
          exit 1

  # Merge the pinned release Pull Request through Safe Merge
  merge:
    needs: [plan, pin, confirm-checks]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.pin.result == 'success' &&
      needs.confirm-checks.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    uses: ./.github/workflows/safe-merge.yml
    with:
      scope: selected
      pr_numbers: ${{ needs.pin.outputs.pr }}
      delete_branch: ${{ 'true' }}
      confirm: MERGE
      caller: official-publish

  verify-main:
    needs: [plan, pin, merge]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.pin.result == 'success' &&
      needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      version: ${{ steps.merged.outputs.version }}
      sha: ${{ steps.merged.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.pin.outputs.pr }}
      VERSION: ${{ needs.pin.outputs.version }}
    steps:
      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Verify the merged main state
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          pr="$PR_NUMBER"
          version="$VERSION"
          git fetch origin main --quiet
          state=$(gh pr view "$pr" --json state,mergedAt \
            | jq -r 'if .mergedAt != null then "merged" else (.state|ascii_downcase) end')
          sha=$(gh pr view "$pr" --json mergeCommit | jq -r '.mergeCommit.oid // ""')
          on_main=false
          if [ -n "$sha" ] && git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then on_main=true; fi
          # This job checked out main at start. Safe Merge advanced origin/main
          # while the working tree stayed on the start-of-run commit.
          current=$(node scripts/release-engine.cjs identity --ref origin/main --field releaseVersion)
          main_sha=$(git rev-parse origin/main)
          set +e
          node scripts/orchestrator-engine.cjs verify-main \
            --version "$version" --current "$current" --state "$state" --on-main "$on_main" \
            --expected-sha "$sha" --main-sha "$main_sha" > merged.json
          code=$?
          set -e
          cat merged.json
          if [ "$code" != "0" ]; then
            echo "::error::$(jq -r '.reason // "merged main state is not the prepared release"' merged.json)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: [plan, prepare-release, verify-main]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') &&
      (needs.verify-main.result == 'success' || needs.verify-main.result == 'skipped') &&
      (
        needs.verify-main.result == 'success' ||
        needs.plan.outputs.step == 'publish' ||
        needs.plan.outputs.step == 'rebuild'
      )
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      stage: publish
      mode: ${{ needs.plan.outputs.publish_mode }}
      release_type: ${{ inputs.release_type }}
      title: ${{ inputs.title }}
      notes: ${{ inputs.notes }}
      caller: official-publish
    secrets: inherit

  confirm:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      version: ${{ steps.published.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch source
        uses: devendrarj25/FRIDAY-AI-ASSISTANT/.github/actions/checkout@main
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Confirm the published release and its assets
        id: published
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          version=$(node scripts/release-engine.cjs identity --ref origin/main --field releaseVersion)
          gh release view "v$version" --json tagName,isDraft,isPrerelease,assets > release.json
          jq -e '.isDraft == false and .isPrerelease == false' release.json >/dev/null || {
            echo "::error::v$version is not a published official release."
            exit 1
          }
          jq -e '[.assets[].name | select(test("\\.exe$"))] | length > 0' release.json >/dev/null || {
            echo "::error::v$version publishes no Windows executable."
            exit 1
          }
          jq -e '[.assets[].name | select(test("latest|manifest|sha256|checksums"; "i"))] | length > 0' release.json >/dev/null || {
            echo "::error::v$version publishes no update/checksum metadata."
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  summary:
    needs: [plan, prepare-release, pin, evidence, validate, confirm-checks, merge, verify-main, publish-release, confirm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Final summary
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_STEP: ${{ needs.plan.outputs.step }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          PIN_RESULT: ${{ needs.pin.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CHECKS_RESULT: ${{ needs.confirm-checks.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          VERIFY_RESULT: ${{ needs.verify-main.result }}
          PUBLISH_RESULT: ${{ needs.publish-release.result }}
          CONFIRM_RESULT: ${{ needs.confirm.result }}
          PREPARED_PR: ${{ needs.pin.outputs.pr }}
          MERGED_VERSION: ${{ needs.verify-main.outputs.version }}
          PUBLISHED_VERSION: ${{ needs.confirm.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## Official Publish"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| planned step | ${PLAN_STEP:-none} |"
            echo "| plan | $PLAN_RESULT |"
            echo "| prepare | $PREPARE_RESULT |"
            echo "| release Pull Request | ${PREPARED_PR:-not required} |"
            echo "| pin | $PIN_RESULT |"
            echo "| validation evidence | $EVIDENCE_RESULT |"
            echo "| PR Validation | $VALIDATE_RESULT |"
            echo "| checks | $CHECKS_RESULT |"
            echo "| Safe Merge | $MERGE_RESULT |"
            echo "| merged main | ${MERGED_VERSION:-$VERIFY_RESULT} |"
            echo "| publish | $PUBLISH_RESULT |"
            echo "| published version | ${PUBLISHED_VERSION:-none} |"
            echo "| confirm | $CONFIRM_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN_RESULT" = "success" ] && [ "$PUBLISH_RESULT" != "success" ]; then
            echo "::error::Official Publish planned '$PLAN_STEP' but publish finished as $PUBLISH_RESULT."
            exit 1
          fi
