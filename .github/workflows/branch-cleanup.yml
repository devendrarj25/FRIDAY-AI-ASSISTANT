# FRIDAY — Merged Branch Cleanup
#
# When a pull request is merged into main, the temporary work branch
# (feature/..., fix/..., upgrade/..., release/vX.Y.Z etc.) is deleted
# automatically so the repository never accumulates permanent side branches.
# A merged release/vX.Y.Z branch has served its purpose — the version now lives
# on main — so it is cleaned up like any other temporary branch.
#
# It never deletes main, never deletes a long-lived protected branch, and it
# never creates a release — merging main is not a release event. Recovery
# branches are owner-controlled evidence and are never automatically deleted.

name: Branch Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only the owner and the two GitHub bots may run this
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          # Allowed actors: the repository owner, github-actions[bot] and
          # dependabot[bot]. Anyone else (a fork contributor, a stranger who
          # opens a pull request) stops here before any work or secret is used.
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            case "$who" in
              "$OWNER"|"github-actions[bot]"|"dependabot[bot]") ;;
              *)
                echo "::error::'$who' may not run FRIDAY workflows. Allowed: $OWNER, github-actions[bot], dependabot[bot]."
                exit 1 ;;
            esac
          done
      - name: Fetch the branch-delete script only
        uses: $/.github/actions/checkout
        with:
          sparse-checkout: scripts/ci-delete-branch.sh
          sparse-checkout-cone-mode: "false"

      - name: Delete the merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          bash scripts/ci-delete-branch.sh "$BRANCH"
