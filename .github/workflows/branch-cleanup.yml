# FRIDAY — Merged Branch Cleanup
#
# When a pull request is merged into main, the temporary work branch
# (feature/..., fix/..., upgrade/..., release/vX.Y.Z etc.) is deleted
# automatically so the repository never accumulates permanent side branches.
# A merged release/vX.Y.Z branch has served its purpose — the version now lives
# on main — so it is cleaned up like any other temporary branch.
#
# After that it sweeps the rest of the repository: every other branch whose work
# is already entirely in main goes too, whether it was merged with a merge commit
# (its tip is an ancestor of main) or squash/rebase-merged (its tip is exactly the
# head commit of a pull request merged into main). A branch with an open pull
# request, or with any commit main does not have, is live work and stays; so does
# a branch whose pull request was never merged. The sweep is best effort: the
# merged head above is already gone, and Maintenance Cleanup is the weekly net.
#
# It never deletes main, never deletes a long-lived protected branch, and it
# never creates a release — merging main is not a release event. Recovery
# branches are owner-controlled evidence and are never automatically deleted.

name: Branch Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  # The sweep lists open and merged pull requests (gh pr list); without this GitHub refuses it.
  pull-requests: read

# One sweep at a time: two merges close together must not race each other deleting the same branches. A waiting run
# is never cancelled mid-delete; the sweep reads the whole repository, so a run that was replaced while waiting loses
# nothing.
concurrency:
  group: friday-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only the owner and the two GitHub bots may run this
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          # Allowed actors: the repository owner, github-actions[bot] and
          # dependabot[bot]. Anyone else (a fork contributor, a stranger who
          # opens a pull request) stops here before any work or secret is used.
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            case "$who" in
              "$OWNER"|"github-actions[bot]"|"dependabot[bot]") ;;
              *)
                echo "::error::'$who' may not run FRIDAY workflows. Allowed: $OWNER, github-actions[bot], dependabot[bot]."
                exit 1 ;;
            esac
          done
      - name: Fetch source
        uses: $/.github/actions/checkout
        with:
          fetch-depth: 0

      - name: Delete the merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          bash scripts/ci-delete-branch.sh "$BRANCH"

      - name: Node toolchain (from package.json engines)
        uses: ./.github/actions/friday-node

      - name: Delete every other branch whose work is already in main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          bash scripts/ci-sweep-branches.sh
