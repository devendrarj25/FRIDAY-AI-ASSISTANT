<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080">
<text x="40" y="50" font-family="Arial" font-size="30" font-weight="bold">Feature Lifecycle</text>
<rect x="55" y="85" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="123" font-family="Arial" font-size="19">Discover</text>
<line x1="750" y1="145" x2="750" y2="165" stroke="black" stroke-width="2"/>
<rect x="55" y="170" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="208" font-family="Arial" font-size="19">Install</text>
<line x1="750" y1="230" x2="750" y2="250" stroke="black" stroke-width="2"/>
<rect x="55" y="255" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="293" font-family="Arial" font-size="19">Configure</text>
<line x1="750" y1="315" x2="750" y2="335" stroke="black" stroke-width="2"/>
<rect x="55" y="340" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="378" font-family="Arial" font-size="19">Resolve dependencies</text>
<line x1="750" y1="400" x2="750" y2="420" stroke="black" stroke-width="2"/>
<rect x="55" y="425" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="463" font-family="Arial" font-size="19">Ready</text>
<line x1="750" y1="485" x2="750" y2="505" stroke="black" stroke-width="2"/>
<rect x="55" y="510" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="548" font-family="Arial" font-size="19">Active</text>
<line x1="750" y1="570" x2="750" y2="590" stroke="black" stroke-width="2"/>
<rect x="55" y="595" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="633" font-family="Arial" font-size="19">Degraded</text>
<line x1="750" y1="655" x2="750" y2="675" stroke="black" stroke-width="2"/>
<rect x="55" y="680" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="718" font-family="Arial" font-size="19">Update</text>
<line x1="750" y1="740" x2="750" y2="760" stroke="black" stroke-width="2"/>
<rect x="55" y="765" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="803" font-family="Arial" font-size="19">Disable</text>
<line x1="750" y1="825" x2="750" y2="845" stroke="black" stroke-width="2"/>
<rect x="55" y="850" width="1390" height="60" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="80" y="888" font-family="Arial" font-size="19">Retire</text>
</svg>
