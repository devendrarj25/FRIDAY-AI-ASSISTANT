<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><g font-family="Arial" fill="#111"><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold">FRIDAY Managed Root</text><rect x="80" y="90" width="1040" height="520" rx="22" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="120" y="130" width="450" height="150" rx="16" fill="#eef4ff" stroke="#333"/><text x="345" y="165" text-anchor="middle" font-size="21" font-weight="bold">Replaceable Application</text><text x="345" y="205" text-anchor="middle" font-size="17">app/current + versions + previous</text><text x="345" y="235" text-anchor="middle" font-size="17">official runtime + official components</text><rect x="630" y="130" width="450" height="150" rx="16" fill="#effaf1" stroke="#333"/><text x="855" y="165" text-anchor="middle" font-size="21" font-weight="bold">Preserved User Ecosystem</text><text x="855" y="205" text-anchor="middle" font-size="17">components/user + user runtimes</text><text x="855" y="235" text-anchor="middle" font-size="17">models + optional packages</text><rect x="120" y="330" width="450" height="150" rx="16" fill="#fff7e8" stroke="#333"/><text x="345" y="365" text-anchor="middle" font-size="21" font-weight="bold">User Data</text><text x="345" y="405" text-anchor="middle" font-size="17">memory + knowledge + settings</text><text x="345" y="435" text-anchor="middle" font-size="17">projects + downloads</text><rect x="630" y="330" width="450" height="150" rx="16" fill="#f3eefc" stroke="#333"/><text x="855" y="365" text-anchor="middle" font-size="21" font-weight="bold">Control Plane</text><text x="855" y="405" text-anchor="middle" font-size="17">registry + manifests + updater journal</text><text x="855" y="435" text-anchor="middle" font-size="17">cache + recovery + logs</text><text x="600" y="555" text-anchor="middle" font-size="20" font-weight="bold">All managed resources live under FRIDAY root wherever technically possible.</text></g></svg>
