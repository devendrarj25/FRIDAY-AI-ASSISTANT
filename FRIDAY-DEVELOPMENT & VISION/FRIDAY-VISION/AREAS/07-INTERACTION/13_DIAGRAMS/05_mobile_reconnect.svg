<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="white"/><text x="40" y="55" font-family="Arial" font-size="30" font-weight="700">Mobile Reconnect / No Replay</text><g font-family="Arial" font-size="20"><rect x="80" y="280" width="240" height="100" fill="#eee" stroke="#333"/><text x="135" y="340">MOBILE</text><rect x="520" y="250" width="340" height="160" fill="#f7f7f7" stroke="#111" stroke-width="3"/><text x="610" y="315">TASK AUTHORITY</text><text x="610" y="350">snapshot + cursor</text><rect x="1060" y="280" width="240" height="100" fill="#eee" stroke="#333"/><text x="1115" y="340">RECONNECT</text><path d="M320 330H520M860 330H1060" stroke="#333" stroke-width="4"/><text x="500" y="500">Never replay a mutating command merely because transport failed.</text></g></svg>
