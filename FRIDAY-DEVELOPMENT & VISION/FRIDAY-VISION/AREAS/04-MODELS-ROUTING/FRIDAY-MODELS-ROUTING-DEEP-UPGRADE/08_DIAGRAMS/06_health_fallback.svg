<line x1="1410.0" y1="420.0" x2="1410.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="790.0" y1="420.0" x2="170.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="160" width="180" height="80" rx="18" fill="#dcfce7" stroke="#0f172a" stroke-width="2"/>
<text x="170.0" y="202" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">READY</text>
<rect x="360" y="160" width="220" height="80" rx="18" fill="#fef3c7" stroke="#0f172a" stroke-width="2"/>
<text x="470.0" y="202" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Failure</text>
<text x="470.0" y="229" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Classify</text>
<rect x="680" y="160" width="220" height="80" rx="18" fill="#e0e7ff" stroke="#0f172a" stroke-width="2"/>
<text x="790.0" y="202" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Retryable?</text>
<text x="790.0" y="229" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Backoff</text>
<rect x="1000" y="160" width="220" height="80" rx="18" fill="#fee2e2" stroke="#0f172a" stroke-width="2"/>
<text x="1110.0" y="202" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Cooldown /</text>
<text x="1110.0" y="229" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Circuit Breaker</text>
<rect x="1300" y="160" width="220" height="80" rx="18" fill="#fce7f3" stroke="#0f172a" stroke-width="2"/>
<text x="1410.0" y="202" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Fallback</text>
<text x="1410.0" y="229" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Candidate</text>
<rect x="1000" y="380" width="220" height="80" rx="18" fill="#dbeafe" stroke="#0f172a" stroke-width="2"/>
<text x="1110.0" y="422" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Recovery</text>
<text x="1110.0" y="449" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Probe</text>
