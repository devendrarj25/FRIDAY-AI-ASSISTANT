<text x="790.0" y="422" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Restore</text>
<rect x="1300" y="380" width="220" height="80" rx="18" fill="#fee2e2" stroke="#0f172a" stroke-width="2"/>
<text x="1410.0" y="422" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Quarantine</text>
<text x="1410.0" y="449" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#0f172a">Endpoint</text>
