<rect width="100%" height="100%" fill="#f8fafc"/><text x="60" y="55" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#0f172a">Health, retry and fallback state machine</text>
<line x1="170.0" y1="200.0" x2="470.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="470.0" y1="200.0" x2="790.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="790.0" y1="200.0" x2="1110.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1110.0" y1="200.0" x2="1410.0" y2="200.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1410.0" y1="200.0" x2="790.0" y2="420.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1110.0" y1="200.0" x2="1110.0" y2="420.0" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
