<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<rect width="1400" height="850" fill="white"/>
<g font-family="Arial" fill="black" stroke="black" stroke-width="2">
<text x="700" y="55" text-anchor="middle" font-size="34" font-weight="700" stroke="none">FRIDAY Transactional Update</text>
<g font-size="23" font-weight="700">
<rect x="70" y="130" width="180" height="90" rx="15" fill="none"/><text x="160" y="185" text-anchor="middle" stroke="none">Check</text>
<rect x="290" y="130" width="180" height="90" rx="15" fill="none"/><text x="380" y="185" text-anchor="middle" stroke="none">Download</text>
<rect x="510" y="130" width="180" height="90" rx="15" fill="none"/><text x="600" y="185" text-anchor="middle" stroke="none">Verify</text>
<rect x="730" y="130" width="180" height="90" rx="15" fill="none"/><text x="820" y="185" text-anchor="middle" stroke="none">Stage</text>
<rect x="950" y="130" width="180" height="90" rx="15" fill="none"/><text x="1040" y="185" text-anchor="middle" stroke="none">Migrate</text>
<rect x="1170" y="130" width="180" height="90" rx="15" fill="none"/><text x="1260" y="185" text-anchor="middle" stroke="none">Health</text>
</g>
<path d="M250 175H290M470 175H510M690 175H730M910 175H950M1130 175H1170" fill="none"/>
<rect x="300" y="330" width="800" height="100" rx="18" fill="none"/><text x="700" y="390" text-anchor="middle" font-size="28" font-weight="700" stroke="none">Activate → Commit → Cleanup</text>
<rect x="100" y="560" width="500" height="120" rx="18" fill="none"/><text x="350" y="610" text-anchor="middle" font-size="25" font-weight="700" stroke="none">Failure before commit</text><text x="350" y="650" text-anchor="middle" font-size="20" stroke="none">discard stage / restore checkpoint</text>
<rect x="800" y="560" width="500" height="120" rx="18" fill="none"/><text x="1050" y="610" text-anchor="middle" font-size="25" font-weight="700" stroke="none">Failure after activation</text><text x="1050" y="650" text-anchor="middle" font-size="20" stroke="none">recovery → last-known-good</text>
</g></svg>