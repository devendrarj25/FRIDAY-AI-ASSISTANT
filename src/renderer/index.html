      html,
      body {
        margin: 0;
        background: #030b1a;
        color: #e8edf5;
      }
      #friday-splash {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: #030b1a;
        font-family: "FridaySplashBody", "Segoe UI", system-ui, sans-serif;
        text-align: center;
        transition: opacity 200ms ease-out;
      }
      #friday-splash.friday-splash-out {
        opacity: 0;
        pointer-events: none;
      }
      #friday-splash .fs-logo {
        /* block + auto margins: the app's stylesheet (Tailwind preflight) makes every image a block once it loads */
        display: block;
        margin: 0 auto;
        width: 132px;
        height: 132px;
        object-fit: contain;
        animation: fs-breathe 3.2s ease-in-out infinite;
      }
      #friday-splash .fs-word {
        margin: 20px 0 0;
        font: 700 36px "FridaySplashDisplay", "Segoe UI", sans-serif;
        letter-spacing: 0.3em;
        padding-left: 0.3em;
        color: #00d4ff;
        text-shadow: 0 0 18px rgba(0, 212, 255, 0.45);
      }
      #friday-splash .fs-line {
        margin: 12px 0 0;
        font-size: 14px;
        font-weight: 500;
      }
      #friday-splash .fs-bar {
        margin: 24px auto 0;
        width: min(28rem, calc(100vw - 3rem));
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #friday-splash .fs-bar i {
        display: block;
        width: 34%;
        height: 100%;
        border-radius: 999px;
        background: #00d4ff;
        animation: fs-slide 1.4s ease-in-out infinite;
      }
      @keyframes fs-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @keyframes fs-breathe {
        50% {
          opacity: 0.82;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #friday-splash .fs-logo,
        #friday-splash .fs-bar i {
          animation: none;
        }
      }
    </style>

  <body>
    <div id="friday-splash" role="status" aria-label="Starting FRIDAY">
      <div>
        <img class="fs-logo" src="./splash-logo.png" width="132" height="132" alt="" />
        <p class="fs-word">FRIDAY</p>
        <p class="fs-line">Starting FRIDAY</p>
        <div class="fs-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
